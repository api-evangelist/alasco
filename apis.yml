- aid: alasco:alasco-invoice-api
  name: Alasco Invoice API
  description: >-
    An **Invoice** is a contractor's request for payment that moves through states from `NEW` to `PAID`.
    Submitting an invoice against an **Asset** creates it in `NEW`, linked only to the asset's project;
    to process it you must link it to a **Contract** (which, in CapEx, belongs to a **Measure**). Invoices
    carry audited and approved amounts, **Documents** and **Tags**, and you can register their payment.
  humanURL: https://developer.alasco.de/fincon.html
  baseURL: https://api.alasco.de/fincon/v1
  tags:
