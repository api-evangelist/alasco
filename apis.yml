aid: alasco
name: Alasco
description: >-
  Alasco is a Munich-based real-estate financial management platform for developers, asset
  managers, and construction teams, replacing spreadsheet-based cost control with integrated
  workflows across the development lifecycle. It spans three products - FinCon (financial
  controlling: projects, properties, contracts, invoices, change orders, cost elements, and
  financial reporting), CapEx (capital-expenditure planning and cost processing across assets
  and measures), and ESG (environmental data: buildings, utility meters, tenants, and
  consumption data). Alasco exposes a REST Public API that follows JSON:API principles, plus
  an official hosted MCP server for AI-agent integrations. It is ISO/IEC 27001 certified and
  serves institutional real-estate firms including Hines, JLL, and Ardian.
