          title: Description
          type: string
        name:
          description: '**Name** · **Name**'
          title: Name
          type: string
        parent:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: '**Parent** · **Übergeordnete Kostengruppe**'
          title: Parent
      required:
      - name
      - cost_category
      - description
      - parent
      title: CostElementAttributes
      type: object
