    ContractUnitPatchAttributes:
      properties:
        description:
          anyOf:
          - type: string
          - type: 'null'
          description: '**Description** · **Beschreibung**'
          title: Description
        initial_budget:
          anyOf:
          - properties:
              net:
                example: '123.123456789012'
                title: Net amount
                type: string
              tax:
                example: '123.123456789012'
                title: Tax amount
                type: string
            type: object
          - type: 'null'
          description: '**Initial budget** · **Ausgangsbudget**


            When set, replaces the stored initial budget (non-cost-element projects only; same constraints as internal contract unit updates). Cannot be cleared via the API; omit the field to leave it unchanged.


            Ersetzt das gespeicherte Ausgangsbudget (nur Projekte ohne Kostengruppen; gleiche Einschränkungen wie bei internen Vergabeeinheits-Updates). Kann über die API nicht geleert werden; Feld weglassen, um es unverändert zu lassen.'
          title: Initial Budget
        name:
          anyOf:
          - maxLength: 250
            type: string
          - type: 'null'
          description: '**Name** · **Name**'
          title: Name
        state:
          anyOf:
          - $ref: '#/components/schemas/ContractUnitState'
          - type: 'null'
          description: '**State** · **Status**


            When set, updates the lifecycle state subject to server rules (e.g. finalized only when all contracts are completed). Cannot transition into or out of contingency or financing through the API.


            Aktualisiert den Status gemäß den Serverregeln (z. B. schlussgerechnet nur, wenn alle Aufträge abgeschlossen sind). Ein Wechsel in oder aus Rückstellung oder Finanzierung ist über die API nicht möglich.


            Available values / Verfügbare Werte:


            | Value | English | Deutsch |

            | --- | --- | --- |

            | `BUDGETED` | Budgeted | Budgetiert |

            | `FULLY_AWARDED` | Fully awarded | Vergeben |

            | `FINALIZED` | Finalised | Schlussgerechnet |

            | `CONTINGENCY` | Contingency | Reserve |

            | `FINANCING` | Financing | Finanzierung |'
      title: ContractUnitPatchAttributes
      type: object
