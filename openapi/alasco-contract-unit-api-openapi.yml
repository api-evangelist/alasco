            Contains links to related objects.

            '
          title: Relationships
        type:
          const: CONTRACT_UNIT
          title: Type
          type: string
      required:
      - id
      - type
      - attributes
      title: 'Data[ContractUnitAttributes, Literal[<ResourceType.CONTRACT_UNIT: ''CONTRACT_UNIT''>]]'
      type: object
    ContractRelationshipData:
      properties:
        data:
          $ref: '#/components/schemas/ContractRelationshipAttributes'
      required:
      - data
      title: ContractRelationshipData
      type: object
    ContractUnitCreateAttributes:
      properties:
        description:
          default: ''
          description: '**Description** · **Beschreibung**'
          title: Description
          type: string
        initial_budget:
          anyOf:
          - properties:
              net:
                example: '123.123456789012'
                title: Net amount
                type: string
              tax:
                example: '123.123456789012'
                title: Tax amount
                type: string
            type: object
          - type: 'null'
          description: '**Initial budget** · **Ausgangsbudget**


            Optional initial budget (net/tax). Only allowed when the target project does not use cost elements; otherwise omit or leave unset.


            Optionales Ausgangsbudget (netto/USt.). Nur zulässig, wenn das Zielprojekt keine Kostengruppen verwendet; andernfalls weglassen.'
          title: Initial Budget
        name:
          description: '**Name** · **Name**'
          maxLength: 250
          title: Name
          type: string
        state:
          $ref: '#/components/schemas/ContractUnitPublicCreateState'
          default: BUDGETED
          description: '**State** · **Status**


            Lifecycle state when creating the contract unit: BUDGETED or CONTINGENCY (contingency / reserve). Financing contract units cannot be created through the API.


            Status beim Anlegen der Vergabeeinheit: BUDGETED oder CONTINGENCY (Rückstellung / Reserve). Finanzierungs-Vergabeeinheiten können nicht über die API angelegt werden.


            Available values / Verfügbare Werte:


            | Value | English | Deutsch |

            | --- | --- | --- |

            | `BUDGETED` | Budgeted | Budgetiert |

            | `CONTINGENCY` | Contingency | Reserve |'
      required:
      - name
      title: ContractUnitCreateAttributes
      type: object
    ContractUnitAttributes:
      properties:
        description:
          description: '**Description** · **Beschreibung**'
          title: Description
          type: string
        name:
          description: '**Name** · **Name**'
          maxLength: 250
          title: Name
          type: string
        project:
          description: '**Project** · **Projekt**'
          format: uuid
          title: Project
          type: string
        state:
          $ref: '#/components/schemas/ContractUnitState'
          description: '**State** · **Status**


            Available values / Verfügbare Werte:


            | Value | English | Deutsch |

            | --- | --- | --- |

            | `BUDGETED` | Budgeted | Budgetiert |

            | `FULLY_AWARDED` | Fully awarded | Vergeben |

            | `FINALIZED` | Finalised | Schlussgerechnet |

            | `CONTINGENCY` | Contingency | Reserve |

            | `FINANCING` | Financing | Finanzierung |'
          examples:
          - BUDGETED
      required:
      - project
      - name
      - state
      - description
      title: ContractUnitAttributes
      type: object
  securitySchemes:
    API Key:
      description: '

        The Alasco API uses a combination of API keys and API tokens to authenticate requests. The API key

        needs to be sent in a header field called `X-API-KEY`.

        '
      in: header
      name: X-API-KEY
      type: apiKey
    API Token:
      description: '

        In addition to an API key, one has to specify an API token. There can be one or more tokens in use

        for the same API key. The token needs to be sent in a header field called `X-API-TOKEN`.

        Right now, it''s not possible to create API keys and API tokens from within Alasco.

        If you are interested in using the Alasco API, please reach out to the

        [support team](mailto:support@alasco.de). They will assist you in generating a key and token pair.

        '
      in: header
      name: X-API-TOKEN
      type: apiKey
