    SalesUnitAttributes:
      properties:
        listed_price:
          description: '**Listed price** · **Planerlös**'
          properties:
            currency:
              description: '**Currency code** · **Währungscode**'
              example: EUR
              title: Currency code
              type: string
            net:
              description: '**Net amount** · **Nettobetrag**'
              example: '123.123456789012'
              title: Net amount
              type: string
            tax:
              description: '**Tax amount** · **Steuerbetrag**'
              example: '123.123456789012'
              title: Tax amount
              type: string
          title: Listed Price
          type: object
        name:
          description: '**Name** · **Name**'
          maxLength: 250
          title: Name
          type: string
        project:
          description: '**Project** · **Projekt**'
          format: uuid
          title: Project
          type: string
        selling_date:
          description: '**Selling date** · **Verkaufsdatum**'
          format: date
          title: Selling Date
          type: string
        sold_price:
          description: '**Sold price** · **Verkaufspreis**'
          properties:
            currency:
              description: '**Currency code** · **Währungscode**'
              example: EUR
              title: Currency code
              type: string
            net:
              description: '**Net amount** · **Nettobetrag**'
              example: '123.123456789012'
              title: Net amount
              type: string
            tax:
              description: '**Tax amount** · **Steuerbetrag**'
              example: '123.123456789012'
              title: Tax amount
              type: string
          title: Sold Price
          type: object
        status:
          $ref: '#/components/schemas/SalesUnitStatus'
          description: '**Status** · **Status**


            Available values / Verfügbare Werte:


            | Value | English | Deutsch |

            | --- | --- | --- |

            | `OPEN` | Open | Offen |

            | `RESERVED` | Reserved | Reserviert |

            | `SOLD` | Sold | Verkauft |'
          examples:
          - OPEN
      required:
      - name
      - status
      - selling_date
      - sold_price
      - listed_price
      - project
      title: SalesUnitAttributes
      type: object
